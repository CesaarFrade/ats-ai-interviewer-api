<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ATS - Iniciar Sesión</title>

    <!-- Fuente moderna (Google Fonts) -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Iconos de Bootstrap -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

    <!-- Nuestro toque mágico de CSS -->
    <style>
        body {
            font-family: 'Inter', sans-serif;
            /* Fondo con degradado elegante */
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
        }
        .login-card {
            border: none;
            border-radius: 1.5rem;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            backdrop-filter: blur(10px);
            background: rgba(255, 255, 255, 0.95);
        }
        .btn-primary {
            background-color: #4f46e5; /* Azul moderno tipo 'Indigo' */
            border: none;
            padding: 0.8rem;
            border-radius: 0.75rem;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        .btn-primary:hover {
            background-color: #4338ca;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3);
        }
        .form-control {
            border-radius: 0.75rem;
        }
        .form-control:focus {
            border-color: #4f46e5;
            box-shadow: 0 0 0 0.25rem rgba(79, 70, 229, 0.25);
        }
        .brand-icon {
            font-size: 3rem;
            color: #4f46e5;
        }
        .enlace-registro {
            color: #4f46e5;
            font-weight: 600;
        }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center vh-100">

    <div class="card login-card p-4 p-md-5" style="width: 100%; max-width: 420px;">

        <div class="text-center mb-4">
            <i class="bi bi-rocket-takeoff brand-icon"></i>
            <h3 class="fw-bold mt-2">Bienvenido al ATS</h3>
            <p class="text-muted small">Inicia sesión para gestionar tu futuro</p>
        </div>

        <!-- Cartel de error (Mejorado con icono) -->
        <div id="mensajeError" class="alert alert-danger d-none border-0 shadow-sm" role="alert">
            <i class="bi bi-exclamation-circle-fill me-2"></i> Credenciales incorrectas.
        </div>

        <form id="loginForm">

            <!-- Usamos Floating Labels -->
            <div class="form-floating mb-3">
                <input type="email" class="form-control" id="email" placeholder="ejemplo@tech.com" required>
                <label for="email text-muted">Correo electrónico</label>
            </div>

            <div class="form-floating mb-4">
                <input type="password" class="form-control" id="password" placeholder="Contraseña" required>
                <label for="password text-muted">Contraseña</label>
            </div>

            <button type="submit" class="btn btn-primary w-100 mb-4">
                Entrar <i class="bi bi-box-arrow-in-right ms-1"></i>
            </button>

            <div class="text-center text-muted">
                ¿No tienes cuenta? <a href="registro.html" class="text-decoration-none enlace-registro">Regístrate aquí</a>
            </div>
        </form>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async function(evento) {
            evento.preventDefault();

            const btnSubmit = this.querySelector('button[type="submit"]');
            const textoOriginal = btnSubmit.innerHTML;
            btnSubmit.innerHTML = '<span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span> Conectando...';
            btnSubmit.disabled = true;

            const emailForm = document.getElementById('email').value;
            const passwordForm = document.getElementById('password').value;
            const mensajeError = document.getElementById('mensajeError');

            try {
                const respuesta = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: emailForm, password: passwordForm })
                });

                if (respuesta.ok) {
                    const token = await respuesta.text();
                    localStorage.setItem('jwtToken', token);

                    btnSubmit.classList.replace('btn-primary', 'btn-success');
                    btnSubmit.innerHTML = '<i class="bi bi-check-circle"></i> ¡Conectado!';

                    const base64Url = token.split('.')[1];
                    const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
                    const payload = JSON.parse(window.atob(base64));

                    console.log("Datos dentro del Token:", payload);

                    setTimeout(() => {
                        const tokenString = JSON.stringify(payload);

                        if (tokenString.includes('ROLE_EMPRESA')) {
                            window.location.href = 'panel-empresa.html';
                        } else {
                            window.location.href = 'panel-candidato.html';
                        }
                    }, 500);

                } else {
                    mensajeError.classList.remove('d-none');
                    btnSubmit.innerHTML = textoOriginal;
                    btnSubmit.disabled = false;
                }
            } catch (error) {
                console.error("Error conectando con el servidor:", error);
                alert("No se pudo conectar con el servidor. ¿Está Spring Boot encendido?");
                btnSubmit.innerHTML = textoOriginal;
                btnSubmit.disabled = false;
            }
        });
    </script>
</body>
</html>
